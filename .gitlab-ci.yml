stages:
  - dockerize
  - deploy

variables:
  TAG: latest-cuda
  APP: speaches
  IMAGE: $AWS_REGISTRY/$APP # Image repository in AWS ECR
  AWS_DEFAULT_REGION: ap-south-1
  BUILD: $CI_PIPELINE_IID
  DOCKER_REPO: cellular-docker.aldar-artifactory.internal
  DOCKER_REPO_NAME: tne
  IMAGE_LOCAL: $DOCKER_REPO/$DOCKER_REPO_NAME/$APP

build-image:
  stage: dockerize
  tags: ["aldar-cellular"]
  image:
    name: $DOCKER_REPO/$DOCKER_REPO_NAME/tne-aws-buildkit-ecr-helper:1.0
    entrypoint: [""]
  script:
    - buildctl-daemonless.sh build 
      --frontend dockerfile.v0 
      --local context=. 
      --local dockerfile=. 
      --export-cache type=registry,ref=$IMAGE:buildcache
      --import-cache type=registry,ref=$IMAGE:buildcache
      --output type=image,name=$IMAGE:$TAG,push=true
  rules:
  - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

